spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: desafiobackend-sea
  docker:
    compose:
      file: compose.yaml
      skip:
        in-tests: false

  flyway:
    placeholders:
      admin_email: ${ADMIN_EMAIL}
      admin_password: ${ADMIN_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600}
  issuer: ${JWT_ISSUER:desafiobackend-sea}

viacep:
  base-url: ${VIACEP_BASE_URL:https://viacep.com.br/ws}
  timeout: ${VIACEP_TIMEOUT:3s}
